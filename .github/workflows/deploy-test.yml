name: Deploy test

on:
  push:
    branches:
      - test-env
  workflow_dispatch:

concurrency:
  group: deploy-test
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      L27_SSH_HOST: ${{ vars.L27_SSH_HOST }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install rsync
        run: sudo apt-get update && sudo apt-get install -y rsync openssh-client

      - name: Load SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.L27_SSH_PRIVATE_KEY }}
        run: |
          eval "$(ssh-agent -s)"
          printf '%b\n' "$SSH_PRIVATE_KEY" | ssh-add -
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Deploy all test apps
        run: node build_tools/bin/deploy-all.mjs --env dev
