services:
  mysql:
    image: mysql:8.4
    container_name: coolestprojects-legacy-import-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: legacy
    ports:
      - "3307:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --max_allowed_packet=256M
    volumes:
      - ./init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-plegacy"]
      interval: 2s
      timeout: 5s
      retries: 30
