############################################################
# registration.coolestprojects.localhost -> workspace:3004
############################################################

<VirtualHost *:80>
    ServerName registration.coolestprojects.localhost
    ServerAlias *.coolestprojects.localhost

    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^ https://%{SERVER_NAME}:8443%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName registration.coolestprojects.localhost
    AllowEncodedSlashes NoDecode

    SSLEngine on
    SSLCertificateFile /etc/apache2/certs/pki/issued/registration.coolestprojects.localhost.crt
    SSLCertificateKeyFile /etc/apache2/certs/pki/private/registration.coolestprojects.localhost.key

    SSLProtocol -all +TLSv1.2 +TLSv1.3

    # Static files 
    ProxyPass /files !

    Alias /files /var/www/files

    <Directory "/var/www/files">
        # Fallback default permissions
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted

        LuaHookAccessChecker /usr/local/apache2/conf/jwt_auth.lua verify_jwt early
    </Directory>

    ProxyPreserveHost On
    # nocanon: preserve %2F in Vite virtual-module URLs
    # upgrade=websocket: Vite HMR (wss://…/_nuxt/) through TLS proxy
    ProxyPass / http://workspace:3004/ nocanon upgrade=websocket
    ProxyPassReverse / http://workspace:3004/

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-For "%{REMOTE_ADDR}s"
</VirtualHost>



