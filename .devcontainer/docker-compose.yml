services:
  workspace:
    container_name: ${PROJECT_NAME:-coolestproject-dev}-workspace
    build:
      context: .
      dockerfile: Dockerfile

    environment:
      # Database configuration (admin & api)
      DB_DIALECT: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: coolestproject
      DB_USER: coolestproject
      DB_PASSWORD: Se84KCCCJlnfkdfv

      # AdminJS configuration
      ADMINJS_COOKIE_SECRET: nic2;To97Di\lF8zC'V{'[_
      ADMINJS_PORT: 3000

      #API config
      JWT_KEY: U\"l!p@@{An31_1dJ60zb6|3
      API_PORT: 3001
      VOTING_KEY: "cEc.#8Pc5^H26OBxKLMKsM"

      # file configuration
      UPLOAD_ROOT: /tmp/uploads
      FILE_SIGN_SECRET: "cxc.#8Pc5^H26465BxKLxKsv"
      APACHE_SECRET: "cEc.#8Pc5^zzH26OBccLMKsdM"

    volumes:
      - ..:/workspace:cached

    working_dir: /workspace

    command: sleep infinity

    ports:
      - "3000:3000"
      - "3001:3001"
      - "3002:3002"
      - "3003:3003"
      - "3004:3004"
      - "3005:3005"

    depends_on:
      - db

  db:
    image: mysql:latest
    container_name: ${PROJECT_NAME:-coolestproject-dev}-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: coolestproject
      MYSQL_DATABASE: coolestproject
      MYSQL_USER: coolestproject
      MYSQL_PASSWORD: Se84KCCCJlnfkdfv
    volumes:
      - db-data:/var/lib/mysql

  phpmyadmin:
    container_name: ${PROJECT_NAME:-coolestproject-dev}-phpadmin
    image: phpmyadmin
    restart: always
    ports:
      - 3006:80
    environment:
      - PMA_ARBITRARY=1

  proxy:
    image: nginx
    container_name: ${PROJECT_NAME:-coolestproject-dev}-proxy
    volumes:
    - ./proxy_templates:/etc/nginx/templates
    - ./certs:/etc/nginx/certs/
    ports:
    - "8080:80"
    - "8443:443"

volumes:
  db-data: