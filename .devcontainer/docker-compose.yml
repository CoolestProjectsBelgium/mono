services:
  workspace:
    container_name: ${PROJECT_NAME:-coolestproject-dev}-workspace
    build:
      context: ./dockerfile_workspace
      dockerfile: Dockerfile

    environment:
      # Trust the system CA store (installed by .devcontainer/start.sh from
      # .devcontainer/certs/pki/ca.crt) so server-side HTTPS calls to
      # *.coolestprojects.localhost verify like a browser that trusted the same CA.
      NODE_OPTIONS: "--use-system-ca"

      # Database configuration (admin & api)
      DB_DIALECT: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: coolestproject
      DB_USER: coolestproject
      DB_PASSWORD: Se84KCCCJlnfkdfv
      DB_SYNC_ALTER: "true"

      # AdminJS configuration
      ADMINJS_COOKIE_SECRET: nic2;To97Di\lF8zC'V{'[_
      ADMINJS_PORT: 3000

      COOKIE_DOMAIN: coolestprojects.localhost

      #API config
      JWT_KEY: U\"l!p@@{An31_1dJ60zb6|3
      API_PORT: 3001
      VOTING_KEY: "cEc.#8Pc5^H26OBxKLMKsM"
      JWT_EXPIRES: "6d"


      CSRF_SECRET: "cEc.&1Pc5^zzH2xp8lmOBc(c)L6KsdM"
      CORS_ORIGINS: "https://registration.coolestprojects.localhost:8443,http://localhost:3004,https://voting.coolestprojects.localhost:8443,http://localhost:3005,https://eventguide.coolestprojects.localhost:8443,http://localhost:3002"
      API_BASE_URL: "https://api.coolestprojects.localhost:8443"

      #CRON_JOB_MAIL: "*/1 * * * *"
      #CRON_JOB_BOUNCE: "*/1 * * * *"

      # file configuration
      UPLOAD_ROOT: /tmp/uploads
      FILE_SIGN_SECRET: "cxc.#8Pc5^H26465BxKLxKsv"
      APACHE_SECRET: "cEc.#8Pc5^zzH26OBccLMKsdM"
      FILE_BASE_URL: "https://register.coolestproject.com/files"
      FILE_SIGNATURE_EXPIRATION: 300

      # Mail (MailHog in Dev Container)
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_FROM: noreply@coolestprojects.localhost

      # Bounce mail detection (CRON_JOB_BOUNCE above) reads via IMAP, not SMTP.
      # MailHog has no IMAP server, so this can't be exercised locally — set
      # these to a real IMAP-capable mailbox (e.g. imap.gmail.com) to test.
      # IMAP_HOST defaults to SMTP_HOST if unset, which is wrong whenever the
      # outbound relay and the bounce mailbox aren't the same host.
      #IMAP_HOST: imap.example.com
      #IMAP_USER: bounces@coolestprojects.be
      #IMAP_PASSWORD: changeme
      #IMAP_PORT: 993

    volumes:
      - ..:/workspace:cached
      - files-data:/tmp/files

    working_dir: /workspace

    command: sleep infinity

    links:
      - "db:db"
      - "mailhog:mailhog"

    ports:
      - "3000:3000"
      - "3001:3001"
      - "3002:3002"
      - "3003:3003"
      - "3004:3004"
      - "3005:3005"

    # Lets server-side code inside this container reach *.coolestprojects.localhost
    # the same way a browser on the host does: that hostname's TLD always resolves to
    # loopback by default (RFC 6761), which is only correct on the host machine itself.
    # host-gateway resolves to the host's own IP as seen from this container, so the
    # request goes out to the host and hits Docker's existing 8443:443/8080:80 publish
    # on `proxy` via hairpin NAT — same path, same port, same URL as the browser uses.
    extra_hosts:
      - "admin.coolestprojects.localhost:host-gateway"
      - "api.coolestprojects.localhost:host-gateway"
      - "eventguide.coolestprojects.localhost:host-gateway"
      - "presentation.coolestprojects.localhost:host-gateway"
      - "registration.coolestprojects.localhost:host-gateway"
      - "voting.coolestprojects.localhost:host-gateway"

    depends_on:
      - db
      - mailhog

  db:
    image: mysql:latest
    container_name: ${PROJECT_NAME:-coolestproject-dev}-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: coolestproject
      MYSQL_DATABASE: coolestproject
      MYSQL_USER: coolestproject
      MYSQL_PASSWORD: Se84KCCCJlnfkdfv
    volumes:
      - db-data:/var/lib/mysql

  mailhog:
    image: mailhog/mailhog
    container_name: ${PROJECT_NAME:-coolestproject-dev}-mailhog
    restart: unless-stopped
    # Host ports use 11025/18025 — Windows often blocks 1025/8025 (Hyper-V reserved range).
    ports:
      - "11025:1025"
      - "18025:8025"

  phpmyadmin:
    container_name: ${PROJECT_NAME:-coolestproject-dev}-phpadmin
    image: phpmyadmin
    restart: always
    ports:
      - 3006:80
    environment:
      - PMA_ARBITRARY=1

  proxy:
    build:
      context: ./dockerfile_proxy
      dockerfile: Dockerfile
    container_name: ${PROJECT_NAME:-coolestproject-dev}-proxy
    volumes:
    - ./certs:/etc/apache2/certs/
    - files-data:/tmp/files
    ports:
    - "8080:80"
    - "8443:443"

    links:
      - "workspace:workspace"

    environment:
      APACHE_SECRET: "cEc.#8Pc5^zzH26OBccLMKsdM"

volumes:
  db-data:
  files-data: