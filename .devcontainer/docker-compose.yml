services:
  workspace:
    container_name: ${PROJECT_NAME:-coolestproject-dev}-workspace
    build:
      context: .
      dockerfile: Dockerfile

    environment:
      # Database configuration (admin & api)
      DB_DIALECT: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: coolestproject
      DB_USER: coolestproject
      DB_PASSWORD: Se84KCCCJlnfkdfv

      DB_HOST_TEST: db_test
      DB_PORT_TEST: 3306
      DB_NAME_TEST: coolestproject_test
      DB_USER_TEST: coolestproject_test
      DB_PASSWORD_TEST: Se84KCCCJlnfkdfv_test

      # AdminJS configuration
      ADMINJS_COOKIE_SECRET: nic2;To97Di\lF8zC'V{'[_
      ADMINJS_PORT: 3000

      # API config
      JWT_KEY: U\"l!p@@{An31_1dJ60zb6|3
      API_PORT: 3001
      VOTING_KEY: "cEc.#8Pc5^H26OBxKLMKsM"

      # Azure Blob (Azurite in dev)
      AZURE_STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;"

      NUXT_PUBLIC_API_BASE: /_api

      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_FROM: noreply@coolestprojects.localhost
      REGISTRATION_URL: https://registration.coolestprojects.localhost:8443
      WEBSITE_URL: https://coolestprojects.be

      # Reliable file watching on Docker bind mounts (Windows/macOS hosts).
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
      WATCHPACK_POLLING: "true"

    volumes:
      - ..:/workspace:cached

    working_dir: /workspace

    command: sleep infinity

    ports:
      - "3000:3000"
      - "3001:3001"
      - "3002:3002"
      - "3003:3003"
      - "3004:3004"
      - "3005:3005"

    depends_on:
      - db
      - db_test
      - azurite
      - mailhog

  db:
    image: mysql:latest
    container_name: ${PROJECT_NAME:-coolestproject-dev}-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: coolestproject
      MYSQL_DATABASE: coolestproject
      MYSQL_USER: coolestproject
      MYSQL_PASSWORD: Se84KCCCJlnfkdfv
    volumes:
      - db-data:/var/lib/mysql

  db_test:
    image: mysql:latest
    container_name: ${PROJECT_NAME:-coolestproject-dev}-db_test
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: coolestproject_test
      MYSQL_DATABASE: coolestproject_test
      MYSQL_USER: coolestproject_test
      MYSQL_PASSWORD: Se84KCCCJlnfkdfv_test
    ports:
      - "3307:3306"
    volumes:
      - db-test-data:/var/lib/mysql

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: ${PROJECT_NAME:-coolestproject-dev}-azurite
    restart: unless-stopped
    ports:
      - "10000:10000"
    volumes:
      - azurite-data:/data

  mailhog:
    image: mailhog/mailhog
    container_name: ${PROJECT_NAME:-coolestproject-dev}-mailhog
    restart: unless-stopped
    # Host ports use 11025/18025 — Windows often blocks 1025/8025 (Hyper-V reserved range).
    ports:
      - "11025:1025"
      - "18025:8025"

  phpmyadmin:
    container_name: ${PROJECT_NAME:-coolestproject-dev}-phpadmin
    image: phpmyadmin
    restart: always
    ports:
      - 3006:80
    environment:
      - PMA_ARBITRARY=1

  proxy:
    image: nginx:alpine
    container_name: ${PROJECT_NAME:-coolestproject-dev}-proxy
    restart: unless-stopped
    volumes:
      - ./proxy_templates:/etc/nginx/templates:ro
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "8080:80"
      - "8443:443"
    depends_on:
      - workspace

volumes:
  db-data:
  db-test-data:
  azurite-data:
