version: '3.8'

services:
  workspace:
    image: node:26

    volumes:
      - ..:/workspace:cached

    working_dir: /workspace

    command: sleep infinity

    ports:
      - "3000:3000"
      - "3001:3001"

    depends_on:
      - mysql

  mysql:
    image: mysql:latest

    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: myapp
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword

    ports:
      - "3306:3306"

    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data: