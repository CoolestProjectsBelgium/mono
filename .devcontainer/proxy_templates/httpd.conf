############################################################
# registration.coolestprojects.localhost -> workspace:3004
############################################################

<VirtualHost *:443>
    ServerName registration.coolestprojects.localhost

    SSLEngine on
    SSLCertificateFile /etc/apache2/certs/pki/issued/registration.coolestprojects.localhost.crt
    SSLCertificateKeyFile /etc/apache2/certs/pki/private/registration.coolestprojects.localhost.key

    SSLProtocol -all +TLSv1.2 +TLSv1.3

    RewriteEngine On

    RewriteCond %{REQUEST_URI} ^/files
    RewriteCond %{QUERY_STRING} (^|&)sig=([^&]+)
    RewriteRule .* - [E=SIG:%2]

    RewriteCond %{REQUEST_URI} ^/files
    RewriteCond %{QUERY_STRING} (^|&)exp=([^&]+)
    RewriteRule .* - [E=EXP:%2]

    PassEnv APACHE_SECRET

    <Location /files>
        AuthRequest "https://api.coolestprojects.localhost/auth/check"

        RequestHeader set X-Sig "%{SIG}e"
        RequestHeader set X-Exp "%{EXP}e"
        RequestHeader set X-Original-URI "%{REQUEST_URI}e"
        RequestHeader set x-apache-secret "%{ENV:APACHE_SECRET}"
    </Location>


    Alias /files /tmp/files

    <Directory /tmp/files>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    ProxyPreserveHost On
    ProxyPass / http://workspace:3004/
    ProxyPassReverse / http://workspace:3004/

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-For "%{REMOTE_ADDR}s"
</VirtualHost>

