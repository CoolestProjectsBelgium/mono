# Redirect all HTTP requests to HTTPS
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule ssl_module modules/mod_ssl.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule lua_module modules/mod_lua.so

ErrorLog /proc/self/fd/2
CustomLog /proc/self/fd/1 combined

LogLevel debug

ServerName localhost

Listen 443

############################################################
# admin.coolestprojects.localhost -> workspace:3000
############################################################

<VirtualHost *:80>
    ServerName admin.coolestprojects.localhost
    ServerAlias *.coolestprojects.localhost

    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^ https://%{SERVER_NAME}:8443%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName admin.coolestprojects.localhost

    SSLEngine on
    SSLCertificateFile /etc/apache2/certs/pki/issued/admin.coolestprojects.localhost.crt
    SSLCertificateKeyFile /etc/apache2/certs/pki/private/admin.coolestprojects.localhost.key

    SSLProtocol -all +TLSv1.2 +TLSv1.3

    ProxyPreserveHost On
    ProxyPass / http://workspace:3000/
    ProxyPassReverse / http://workspace:3000/

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-For "%{REMOTE_ADDR}s"
</VirtualHost>

